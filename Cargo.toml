[package]
name = "cz"
version = "0.2.1"
edition = "2024"
authors = ["Piumal Nipun <piumalnipun9@gmail.com>"]
description = "Jump to directories by partial name: learned frecency history plus scoped fuzzy filesystem search, with an interactive picker"
license = "MIT"
repository = "https://github.com/piumalnipun9/cz"
homepage = "https://github.com/piumalnipun9/cz"
readme = "README.md"
keywords = ["cd", "navigation", "fuzzy", "terminal", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
